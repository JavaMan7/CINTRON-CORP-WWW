<!doctype html>
<!--
  contact.html — CONTACT PAGE
  Heading, email address, "Email us" button and location.
  The email address appears twice below (the text link and the button):
  change both if it ever changes.
  Header and footer are filled in by js/site.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Cintron Corp</title>
  <meta name="description" content="Have a project, a quote request or a question about our products and services? We would be glad to hear from you.">
  <meta name="theme-color" content="#A50034">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/global.css">
</head>

<body data-page="contact">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="site-header" data-site-header></header>

  <main id="main-content">

    <!-- ===== PAGE HEADING ===== -->
    <section class="page-hero site-container">
      <span class="accent-rule" aria-hidden="true"></span><p class="eyebrow">Get in touch</p>
      <h1>Start a Conversation</h1>
      <p>Have a project, a quote request or a question about our products and services? We would be glad to hear from you.</p>
    </section>

    <!-- ===== CONTACT DETAILS ===== -->
    <div class="contact-content site-container prose">
      <p>Email us at <a href="mailto:info@cintron.ca">info@cintron.ca</a> and our team will get back to you.</p>
      <a href="mailto:info@cintron.ca" class="contact-button contact-button--large">Email us <span aria-hidden="true">→</span></a>
      <p class="contact-location">Based in Winnipeg, Manitoba</p>
    </div>

  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script src="js/site.js"></script>
</body>
</html>
